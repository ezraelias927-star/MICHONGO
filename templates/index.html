<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <meta name="google-site-verification" content="UauEcBd8i9iRLlZ1Lowr3NXr1Pr5AQ2ruC5jIAjCuu4" />
  <title>MICHONGO</title>
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/icons.css">
  <link rel="stylesheet" href="static/css/layout.css">
  <link rel="stylesheet" href="static/css/header.css">
  <link rel="stylesheet" href="static/css/bottom-nav.css">
  <link rel="stylesheet" href="static/css/hamburger.css">
  <link rel="stylesheet" href="static/css/spinner.css">
  <link rel="stylesheet" href="static/css/bottomhidden.css">
  <link rel="stylesheet" href="static/css/modal.css">

  <link rel="icon" type="image/jpg" href="{{ url_for('static', filename='favicon.jpg') }}">

</head>
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/components/nav-auth.js') }}"></script>

<body>
  <!-- Logout Confirmation Modal -->
<div id="logout-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h3>Uhakika Unataka Kutoka?</h3>
    <p>Utalazimika kuingia tena ukihitaji kuposti au kuendesha michongo yako.</p>
    <div class="modal-actions">
      <button id="modal-cancel-btn" class="modal-btn modal-btn--secondary" type="button">Ghairi</button>
      <button id="modal-confirm-btn" class="modal-btn modal-btn--danger" type="button">Ndio, Toka</button>
    </div>
  </div>
</div>

  <!-- Backdrop ya Giza -->
  <div id="menu-backdrop" class="menu-backdrop"></div>

  <header id="app-header" class="app-header" style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem;">
    <!-- Kitufe cha Hamburger Menu -->
    <button id="menu-btn" class="icon-btn" type="button" aria-label="Fungua menyu">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Jina la Kampuni / Mfumo badala ya Search Bar -->
    <div style="font-weight: 800; font-size: 1.125rem; letter-spacing: -0.5px; color: var(--color-text, #0f172a);">
      MICHONGO
    </div>

    <!-- Nafasi tupu kidogo kwa ajili ya usawa (balance) ya upande wa kulia kama inahitajika -->
    <div style="width: 24px;"></div>
  </header>

  <!-- Hamburger Drawer Menu -->
  <div id="mobile-menu">
    <div style="font-weight: 800; font-size: 1.125rem; color: var(--color-text); margin-bottom: 1rem; padding-left: 0.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.75rem;">
      MICHONGO
    </div>
    <a href="#/">Tazama Michongo</a>
    <a href="#/new">Weka Mchongo</a>
    <a href="#/about">Kuhusu Sisi</a>
  </div>

  <main id="view" class="app-main">
    <p class="feed-placeholder">Michongo itaonekana hapa.</p>
  </main>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Menyu ya haraka">
  
  <!-- 1. VIPENGELE VYA MGENI -->
  <a id="nav-register" class="bottom-nav__item" href="#/register" data-route="register">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
    </svg>
    <span>Register</span>
  </a>

  <a id="nav-login" class="bottom-nav__item" href="#/login" data-route="login">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
    </svg>
    <span>Login</span>
  </a>

  <!-- 2. KIPENGELE CHA ALIYELOGIN (Profile) -->
  <a id="nav-profile" class="bottom-nav__item bottom-nav__item--profile hidden" href="#/profile" data-route="profile">
    <!-- Ikoni ya mchoro wa mtu (Standard User Icon) -->
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <span id="nav-user-name">Akaunti</span>
</a>

  <!-- 3. KITUFE CHA LOGOUT (Kinaonekana tu mtumiaji akiwa amelogin) -->
  <button id="nav-logout-btn" class="bottom-nav__item hidden logout-btn-reset" type="button">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    <span>Toka</span>
  </button>

  <!-- 4. KITUFE CHA POST MPYA (Kinaonekana muda wote) -->
  <a class="bottom-nav__item bottom-nav__item--cta" href="#/new" data-route="new">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <span>Post Mpya</span>
  </a>

</nav>

</body>
</html>
